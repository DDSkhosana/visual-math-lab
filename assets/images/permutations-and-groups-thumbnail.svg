<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Permutations and Symmetric Groups S_n Illustration</title>
  <desc id="desc">Disjoint cycle orbits and vertical string braiding diagrams representing permutations in symmetric groups.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Left: Disjoint Cycles Orbit Diagram (1 2 3)(4 5) -->
  <text x="330" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#475569">
    DISJOINT CYCLES: (1 2 3)(4 5)
  </text>

  <!-- 3-Cycle Triangle: 1, 2, 3 -->
  <!-- Center (250, 360), r = 110 -->
  <!-- 1 at top: (250, 250) -->
  <!-- 2 at bottom-right: (345, 415) -->
  <!-- 3 at bottom-left: (155, 415) -->
  <!-- Triangle perimeter curves -->
  <path d="M 250 250 Q 320 310 345 415" fill="none" stroke="#0284c7" stroke-width="8"/>
  <path d="M 345 415 Q 250 450 155 415" fill="none" stroke="#0284c7" stroke-width="8"/>
  <path d="M 155 415 Q 180 310 250 250" fill="none" stroke="#0284c7" stroke-width="8"/>

  <circle cx="250" cy="250" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <text x="250" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>

  <circle cx="345" cy="415" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <text x="345" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

  <circle cx="155" cy="415" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <text x="155" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>

  <!-- 2-Cycle Swap: 4, 5 (cx=470, cy=360) -->
  <path d="M 470 290 Q 520 360 470 430" fill="none" stroke="#db2777" stroke-width="8"/>
  <path d="M 470 430 Q 420 360 470 290" fill="none" stroke="#db2777" stroke-width="8"/>

  <circle cx="470" cy="290" r="32" fill="#1e293b" stroke="#f472b6" stroke-width="8"/>
  <text x="470" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>

  <circle cx="470" cy="430" r="32" fill="#1e293b" stroke="#f472b6" stroke-width="8"/>
  <text x="470" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">5</text>

  <!-- Divider Line -->
  <line x1="590" y1="120" x2="590" y2="680" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Right: String Braiding Diagram -->
  <text x="890" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#475569">
    STRING BRAIDING &amp; CROSSINGS
  </text>

  <!-- Rails -->
  <line x1="680" y1="210" x2="1100" y2="210" stroke="#94a3b8" stroke-width="4"/>
  <line x1="680" y1="570" x2="1100" y2="570" stroke="#94a3b8" stroke-width="4"/>

  <!-- Strands: 1->3, 2->1, 3->2, 4->5, 5->4 -->
  <!-- Strand 1 (Sky Blue) 720 -> 880 -->
  <path d="M 720 210 C 720 390, 880 390, 880 570" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 2 (Purple) 800 -> 720 -->
  <path d="M 800 210 C 800 390, 720 390, 720 570" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 3 (Amber) 880 -> 800 -->
  <path d="M 880 210 C 880 390, 800 390, 800 570" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 4 (Pink) 980 -> 1060 -->
  <path d="M 980 210 C 980 390, 1060 390, 1060 570" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  <!-- Strand 5 (Emerald) 1060 -> 980 -->
  <path d="M 1060 210 C 1060 390, 980 390, 980 570" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>

  <!-- Top input terminal beads -->
  <circle cx="720" cy="210" r="14" fill="#0284c7"/>
  <circle cx="800" cy="210" r="14" fill="#8b5cf6"/>
  <circle cx="880" cy="210" r="14" fill="#f59e0b"/>
  <circle cx="980" cy="210" r="14" fill="#ec4899"/>
  <circle cx="1060" cy="210" r="14" fill="#10b981"/>

  <!-- Bottom output terminal beads -->
  <circle cx="720" cy="570" r="14" fill="#8b5cf6"/>
  <circle cx="800" cy="570" r="14" fill="#f59e0b"/>
  <circle cx="880" cy="570" r="14" fill="#0284c7"/>
  <circle cx="980" cy="570" r="14" fill="#10b981"/>
  <circle cx="1060" cy="570" r="14" fill="#ec4899"/>

  <!-- Inversion crossing indicators -->
  <circle cx="760" cy="300" r="10" fill="#f59e0b"/>
  <circle cx="840" cy="300" r="10" fill="#f59e0b"/>
  <circle cx="1020" cy="390" r="10" fill="#f59e0b"/>

  <!-- Parity label -->
  <text x="890" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#059669">
    EVEN PARITY &middot; sgn(σ) = +1 &middot; ORDER = lcm(3, 2) = 6
  </text>

  <!-- Title Banner -->
  <text x="600" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" font-weight="bold" fill="#111111">
    PERMUTATIONS &amp; SYMMETRIC GROUPS S_n
  </text>
</svg>
