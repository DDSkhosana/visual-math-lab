<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cyclic Quadrilateral Theorem illustration</title>
  <desc id="desc">Opposite angles of an inscribed cyclic quadrilateral sum to exactly 180 degrees.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Inscribed Quadrilateral fill -->
  <polygon points="423,213 777,213 750,595 384,515" fill="rgba(99, 102, 241, 0.12)" stroke="#111111" stroke-width="12" stroke-linejoin="round"/>

  <!-- Circle -->
  <circle cx="600" cy="390" r="250" fill="none" stroke="#111111" stroke-width="16"/>

  <!-- Colored Interior Angle Arcs -->
  <!-- Vertex A (Violet α) -->
  <path d="M 465 213 A 45 45 0 0 1 410 255" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
  <!-- Vertex C (Violet 180°-α) -->
  <path d="M 720 560 A 45 45 0 0 1 760 550" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
  <!-- Vertex B (Cyan β) -->
  <path d="M 735 213 A 45 45 0 0 0 770 255" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <!-- Vertex D (Rose 180°-β) -->
  <path d="M 395 470 A 45 45 0 0 1 425 525" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>

  <!-- Vertices -->
  <circle cx="423" cy="213" r="14" fill="#a855f7"/>
  <text x="385" y="190" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#a855f7">A</text>

  <circle cx="777" cy="213" r="14" fill="#06b6d4"/>
  <text x="795" y="190" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#06b6d4">B</text>

  <circle cx="750" cy="595" r="14" fill="#fbbf24"/>
  <text x="770" y="635" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#fbbf24">C</text>

  <circle cx="384" cy="515" r="14" fill="#f43f5e"/>
  <text x="335" y="545" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#f43f5e">D</text>

  <!-- Opposite Angles Sum Equations -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#111111">∠A + ∠C = 180°</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#111111">∠B + ∠D = 180°</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">CYCLIC QUADRILATERAL THEOREM</text>
</svg>