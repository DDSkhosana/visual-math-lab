<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Tangent-Radius Perpendicularity Theorem illustration</title>
  <desc id="desc">A tangent to a circle is strictly perpendicular to the radius at the point of contact (90 degrees).</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Subtle radial sector highlighting perpendicular quadrant -->
  <path d="M 600 380 L 600 620 A 240 240 0 0 0 840 380 Z" fill="rgba(16, 185, 129, 0.08)" stroke="none"/>

  <!-- Circle -->
  <circle cx="600" cy="380" r="240" fill="none" stroke="#111111" stroke-width="16"/>

  <!-- Center O -->
  <circle cx="600" cy="380" r="14" fill="#111111"/>
  <text x="618" y="360" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#111111">O</text>

  <!-- Radius line OT (Indigo / Blue) -->
  <line x1="600" y1="380" x2="600" y2="620" stroke="#6366f1" stroke-width="14" stroke-linecap="round"/>

  <!-- Tangent Line at T (Emerald) -->
  <line x1="220" y1="620" x2="980" y2="620" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>

  <!-- 90° Right Angle Marker Box at T -->
  <path d="M 570 620 L 570 590 L 600 590" fill="none" stroke="#14b8a6" stroke-width="8"/>
  <text x="525" y="580" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#14b8a6">90°</text>

  <!-- Point of Contact T -->
  <circle cx="600" cy="620" r="14" fill="#ef4444"/>
  <text x="618" y="665" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ef4444">T</text>

  <!-- Semantic Labels -->
  <text x="625" y="490" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6366f1">Radius (r)</text>
  <text x="980" y="605" text-anchor="end" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#10b981">Tangent</text>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#111111">OT ⟂ Tangent</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">TANGENT-RADIUS THEOREM</text>
</svg>