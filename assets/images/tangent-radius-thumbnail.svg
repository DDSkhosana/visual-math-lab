<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Tangent-Radius Theorem illustration</title>
  <desc id="desc">A tangent to a circle is perpendicular to the radius at the point of contact.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>
  <circle cx="600" cy="380" r="240" fill="none" stroke="#111111" stroke-width="16"/>
  <!-- Center O -->
  <circle cx="600" cy="380" r="14" fill="#111111"/>
  <text x="615" y="360" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#111111">O</text>
  <!-- Radius to T (600, 620) -->
  <line x1="600" y1="380" x2="600" y2="620" stroke="#6366f1" stroke-width="14"/>
  <circle cx="600" cy="620" r="14" fill="#ef4444"/>
  <text x="615" y="665" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ef4444">T</text>
  <!-- Tangent line at T -->
  <line x1="260" y1="620" x2="940" y2="620" stroke="#10b981" stroke-width="14"/>
  <!-- Right angle box at T -->
  <path d="M575 620 L575 595 L600 595" fill="none" stroke="#14b8a6" stroke-width="8"/>
  <text x="540" y="585" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#14b8a6">90°</text>
  <text x="700" y="500" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6366f1">Radius r</text>
  <text x="960" y="630" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#10b981">Tangent</text>
  <!-- Title -->
  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">TANGENT-RADIUS THEOREM</text>
</svg>