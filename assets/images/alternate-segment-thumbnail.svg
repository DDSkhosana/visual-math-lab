<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Alternate Segment Theorem illustration</title>
  <desc id="desc">The angle between a tangent and a chord equals the angle subtended by that chord in the alternate segment.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Shaded Alternate Segment (Major: Sky Blue token) -->
  <path d="M 600 620 L 392 260 A 240 240 0 1 1 600 620 Z" fill="rgba(2, 132, 199, 0.20)" stroke="none"/>
  <!-- Shaded Alternate Segment (Minor: Violet token) -->
  <path d="M 600 620 L 392 260 A 240 240 0 0 0 600 620 Z" fill="rgba(168, 85, 247, 0.22)" stroke="none"/>

  <!-- Inscribed Triangle TAB fill -->
  <polygon points="600,620 392,260 808,260" fill="rgba(234, 179, 8, 0.08)" stroke="none"/>

  <!-- Circle -->
  <circle cx="600" cy="380" r="240" fill="none" stroke="#111111" stroke-width="16"/>

  <!-- Tangent Line at Contact Point T (Emerald) -->
  <line x1="200" y1="620" x2="1000" y2="620" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>

  <!-- Primary Chord TA (Amber) -->
  <line x1="600" y1="620" x2="392" y2="260" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>

  <!-- Other Triangle Chords: TB and AB (Muted) -->
  <line x1="600" y1="620" x2="808" y2="260" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="392" y1="260" x2="808" y2="260" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>

  <!-- Angle Arc at T between Tangent and Chord TA (Yellow α) -->
  <path d="M 540 620 A 60 60 0 0 1 570 568" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
  <text x="515" y="585" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#eab308">α</text>

  <!-- Inscribed Angle Arc at B in Alternate Segment (Yellow α) -->
  <path d="M 750 260 A 58 58 0 0 1 773 310" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
  <text x="730" y="325" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#eab308">α</text>

  <!-- Vertices -->
  <circle cx="600" cy="620" r="14" fill="#ef4444"/>
  <text x="618" y="665" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ef4444">T</text>

  <circle cx="392" cy="260" r="14" fill="#f59e0b"/>
  <text x="345" y="250" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#f59e0b">A</text>

  <circle cx="808" cy="260" r="14" fill="#0284c7"/>
  <text x="830" y="250" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#0284c7">B</text>

  <!-- Descriptive Segment Annotations in Distinct Colours (Abbreviated) -->
  <text x="620" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#0284c7">Alt Seg (Maj)</text>
  <text x="440" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a855f7">Alt Seg (Min)</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">ALTERNATE SEGMENT THEOREM</text>
</svg>