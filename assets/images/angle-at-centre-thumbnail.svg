<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Angle at the Centre Theorem illustration</title>
  <desc id="desc">A circle with central angle AOB twice the inscribed angle APB.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>
  <!-- Circle -->
  <circle cx="600" cy="400" r="260" fill="none" stroke="#111111" stroke-width="16"/>
  <!-- Center O -->
  <circle cx="600" cy="400" r="14" fill="#111111"/>
  <text x="615" y="435" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#111111">O</text>
  <!-- Points A, B, P: A=(375, 530), B=(825, 530), P=(600, 140) -->
  <circle cx="375" cy="530" r="14" fill="#ef4444"/>
  <text x="320" y="560" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ef4444">A</text>
  <circle cx="825" cy="530" r="14" fill="#f97316"/>
  <text x="850" y="560" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#f97316">B</text>
  <circle cx="600" cy="140" r="14" fill="#a855f7"/>
  <text x="590" y="110" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#a855f7">P</text>
  <!-- Radii to Center: OA, OB -->
  <line x1="600" y1="400" x2="375" y2="530" stroke="#6366f1" stroke-width="12"/>
  <line x1="600" y1="400" x2="825" y2="530" stroke="#6366f1" stroke-width="12"/>
  <!-- Inscribed chords: PA, PB -->
  <line x1="600" y1="140" x2="375" y2="530" stroke="#3b82f6" stroke-width="12"/>
  <line x1="600" y1="140" x2="825" y2="530" stroke="#fb923c" stroke-width="12"/>
  <!-- Central angle arc & label 2θ -->
  <path d="M530 440 A80 80 0 0 0 670 440" fill="none" stroke="#eab308" stroke-width="10"/>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#eab308">2θ</text>
  <!-- Inscribed angle arc & label θ -->
  <path d="M565 190 A60 60 0 0 0 635 190" fill="none" stroke="#10b981" stroke-width="10"/>
  <text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#10b981">θ</text>
  <!-- Title -->
  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">ANGLE AT THE CENTRE THEOREM</text>
</svg>