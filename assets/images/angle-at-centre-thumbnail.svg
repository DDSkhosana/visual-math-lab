<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Angle at the Centre Theorem illustration</title>
  <desc id="desc">The angle subtended by an arc at the centre is exactly twice the angle subtended at the circumference.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Inscribed triangle fill -->
  <polygon points="600,140 383,515 817,515" fill="rgba(168, 85, 247, 0.08)" stroke="none"/>
  <!-- Central sector fill -->
  <path d="M 600 390 L 383 515 A 250 250 0 0 0 817 515 Z" fill="rgba(234, 179, 8, 0.14)" stroke="none"/>

  <!-- Circle -->
  <circle cx="600" cy="390" r="250" fill="none" stroke="#111111" stroke-width="16"/>

  <!-- Subtending Arc AB on bottom circumference (Cyan highlight) -->
  <path d="M 383 515 A 250 250 0 0 0 817 515" fill="none" stroke="#06b6d4" stroke-width="16" stroke-linecap="round"/>

  <!-- Radii to Center: OA, OB (Indigo) -->
  <line x1="600" y1="390" x2="383" y2="515" stroke="#6366f1" stroke-width="12" stroke-linecap="round"/>
  <line x1="600" y1="390" x2="817" y2="515" stroke="#6366f1" stroke-width="12" stroke-linecap="round"/>

  <!-- Inscribed chords: PA, PB (Violet and Orange) -->
  <line x1="600" y1="140" x2="383" y2="515" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
  <line x1="600" y1="140" x2="817" y2="515" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>

  <!-- Central Angle Arc 2θ (Yellow) -->
  <path d="M 535 428 A 75 75 0 0 0 665 428" fill="none" stroke="#eab308" stroke-width="10" stroke-linecap="round"/>
  <text x="600" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#eab308">2θ</text>

  <!-- Inscribed Angle Arc θ (Emerald) -->
  <path d="M 565 200 A 70 70 0 0 0 635 200" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#10b981">θ</text>

  <!-- Center O -->
  <circle cx="600" cy="390" r="14" fill="#111111"/>
  <text x="618" y="380" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#111111">O</text>

  <!-- Points A, B, P -->
  <circle cx="383" cy="515" r="14" fill="#ef4444"/>
  <text x="330" y="545" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ef4444">A</text>
  <circle cx="817" cy="515" r="14" fill="#f97316"/>
  <text x="840" y="545" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#f97316">B</text>
  <circle cx="600" cy="140" r="14" fill="#a855f7"/>
  <text x="590" y="105" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#a855f7">P</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">ANGLE AT THE CENTRE THEOREM</text>
</svg>