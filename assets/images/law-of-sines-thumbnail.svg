<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Law of Sines &amp; Circumcircle Invariant illustration</title>
  <desc id="desc">An inscribed triangle ABC inside a circumcircle of diameter 2R, illustrating a/sin A = b/sin B = c/sin C = 2R.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Inscribed Triangle ABC fill -->
  <polygon points="374,500 826,500 644,144" fill="rgba(56, 189, 248, 0.12)" stroke="none"/>

  <!-- Circumcircle -->
  <circle cx="600" cy="390" r="250" fill="none" stroke="#111111" stroke-width="16"/>

  <!-- Antipodal Thales Diameter Bridge B to A' (Amber dashed) -->
  <line x1="826" y1="500" x2="374" y2="280" stroke="#f59e0b" stroke-width="9" stroke-dasharray="14,10"/>
  <line x1="374" y1="280" x2="644" y2="144" stroke="#f59e0b" stroke-width="8" stroke-dasharray="10,8"/>

  <!-- Altitude hc (Teal dashed) -->
  <line x1="644" y1="144" x2="644" y2="500" stroke="#14b8a6" stroke-width="8" stroke-dasharray="10,8"/>

  <!-- Triangle Chords: c = AB (Violet), b = AC (Emerald), a = BC (Red) -->
  <line x1="374" y1="500" x2="826" y2="500" stroke="#a855f7" stroke-width="13" stroke-linecap="round"/>
  <line x1="374" y1="500" x2="644" y2="144" stroke="#10b981" stroke-width="13" stroke-linecap="round"/>
  <line x1="826" y1="500" x2="644" y2="144" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>

  <!-- Center O -->
  <circle cx="600" cy="390" r="12" fill="#6366f1"/>
  <text x="560" y="385" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6366f1">2R</text>

  <!-- Vertices -->
  <circle cx="374" cy="500" r="14" fill="#ef4444"/>
  <text x="325" y="525" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ef4444">A</text>

  <circle cx="826" cy="500" r="14" fill="#10b981"/>
  <text x="850" y="525" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#10b981">B</text>

  <circle cx="644" cy="144" r="14" fill="#a855f7"/>
  <text x="635" y="110" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#a855f7">C</text>

  <!-- Chord Labels -->
  <text x="765" y="315" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ef4444">a</text>
  <text x="475" y="315" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#059669">b</text>
  <text x="600" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#9333ea">c</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">LAW OF SINES &amp; CIRCUMCIRCLE</text>
</svg>

