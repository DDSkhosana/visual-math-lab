<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Angle-Sum &amp; Rotation Matrix Homomorphism illustration</title>
  <desc id="desc">Stacked right triangles on the unit circle showing rotation composition R(α)R(β) = R(α+β).</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Axes -->
  <line x1="260" y1="540" x2="940" y2="540" stroke="#94a3b8" stroke-width="6" stroke-dasharray="10,8"/>
  <line x1="360" y1="120" x2="360" y2="620" stroke="#94a3b8" stroke-width="6" stroke-dasharray="10,8"/>

  <!-- Quarter Unit Circle Arc -->
  <path d="M 800 540 A 440 440 0 0 0 360 100" fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round"/>

  <!-- Stacked Triangles: O(360,540), M(690,540), Q(690,349), P(595,168) -->
  <polygon points="360,540 690,540 690,349" fill="rgba(2, 132, 199, 0.14)" stroke="none"/>
  <polygon points="360,540 690,349 595,168" fill="rgba(168, 85, 247, 0.16)" stroke="none"/>

  <!-- Orthogonal bounding box dashed lines -->
  <line x1="690" y1="540" x2="690" y2="168" stroke="#f59e0b" stroke-width="8" stroke-dasharray="12,8"/>
  <line x1="595" y1="168" x2="595" y2="540" stroke="#10b981" stroke-width="8" stroke-dasharray="12,8"/>
  <line x1="595" y1="168" x2="690" y2="168" stroke="#e11d48" stroke-width="8" stroke-dasharray="12,8"/>

  <!-- Edges of Stacked Triangles -->
  <line x1="360" y1="540" x2="690" y2="349" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <line x1="690" y1="349" x2="595" y2="168" stroke="#9333ea" stroke-width="12" stroke-linecap="round"/>
  <line x1="360" y1="540" x2="595" y2="168" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>

  <!-- Angle Wedges alpha and beta -->
  <path d="M 460 540 A 100 100 0 0 0 446 490" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round"/>
  <text x="482" y="525" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#0284c7">α</text>

  <path d="M 464 480 A 120 120 0 0 0 424 438" fill="none" stroke="#9333ea" stroke-width="9" stroke-linecap="round"/>
  <text x="466" y="452" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#9333ea">β</text>

  <!-- Vertices -->
  <circle cx="360" cy="540" r="14" fill="#111111"/>
  <text x="315" y="582" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#111111">O</text>

  <circle cx="690" cy="349" r="13" fill="#f59e0b"/>
  <text x="712" y="360" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#d97706">Q</text>

  <circle cx="595" cy="168" r="15" fill="#10b981"/>
  <text x="580" y="132" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#059669">P(α + β)</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">ANGLE-SUM &amp; ROTATION MATRICES</text>
</svg>

