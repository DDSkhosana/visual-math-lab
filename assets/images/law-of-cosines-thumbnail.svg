<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Law of Cosines &amp; Orthogonal Projection illustration</title>
  <desc id="desc">Triangle ABC decomposed by orthogonal altitude h = a sin C and projection a cos C, proving c² = a² + b² - 2ab cos C.</desc>
  <rect width="1200" height="800" fill="#ece9e1"/>

  <!-- Triangle CAB fill -->
  <polygon points="280,540 920,540 530,190" fill="rgba(20, 184, 166, 0.14)" stroke="none"/>

  <!-- Orthogonal Altitude BD (Amber dashed) -->
  <line x1="530" y1="190" x2="530" y2="540" stroke="#f59e0b" stroke-width="10" stroke-dasharray="14,10"/>
  <!-- Right angle marker at foot D(530, 540) -->
  <path d="M 530 512 L 558 512 L 558 540" fill="none" stroke="#f59e0b" stroke-width="7"/>

  <!-- Projection segment CD = a cos C -->
  <line x1="280" y1="568" x2="530" y2="568" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>

  <!-- Angle C wedge at C(280, 540) -->
  <path d="M 355 540 A 75 75 0 0 0 324 479" fill="none" stroke="#e11d48" stroke-width="10" stroke-linecap="round"/>
  <text x="372" y="512" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#e11d48">C</text>

  <!-- Sides: b = CA (Emerald), a = CB (Sky), c = AB (Rose) -->
  <line x1="280" y1="540" x2="920" y2="540" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
  <line x1="280" y1="540" x2="530" y2="190" stroke="#0284c7" stroke-width="14" stroke-linecap="round"/>
  <line x1="920" y1="540" x2="530" y2="190" stroke="#f43f5e" stroke-width="14" stroke-linecap="round"/>

  <!-- Vertices -->
  <circle cx="280" cy="540" r="14" fill="#e11d48"/>
  <text x="230" y="555" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#111111">C</text>

  <circle cx="920" cy="540" r="14" fill="#10b981"/>
  <text x="945" y="555" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#111111">A</text>

  <circle cx="530" cy="190" r="14" fill="#0284c7"/>
  <text x="515" y="150" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#0284c7">B</text>

  <circle cx="530" cy="540" r="11" fill="#f59e0b"/>
  <text x="520" y="612" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#d97706">D (a cos C)</text>

  <!-- Dimension Labels -->
  <text x="370" y="345" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#0284c7">a</text>
  <text x="735" y="600" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#059669">b</text>
  <text x="755" y="345" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#e11d48">c</text>
  <text x="548" y="385" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#d97706">a sin C</text>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" fill="#111111">LAW OF COSINES &amp; PROJECTION</text>
</svg>

