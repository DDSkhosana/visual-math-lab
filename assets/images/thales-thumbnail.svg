  <line x1="180" y1="580" x2="625" y2="194" stroke="#d75a34" stroke-width="14"/>
  <line x1="625" y1="194" x2="1020" y2="580" stroke="#2d5f86" stroke-width="14"/>
  <path d="M602 218 L624 239 L646 218" fill="none" stroke="#111111" stroke-width="10"/>
