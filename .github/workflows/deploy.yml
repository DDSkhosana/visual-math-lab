name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/validate-site.mjs
      - run: node scripts/generate-sitemap.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Automation Repository
        if: success()
        continue-on-error: true
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.AUTOMATION_PAT }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "AUTOMATION_TOKEN secret is not set; skipping cross-repo notification."
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "$CHANGED_FILES" | grep -q "^data/visuals\.json$"; then
            echo "Detected updates to data/visuals.json. Dispatching visual-updated event..."
            curl -s -f -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $AUTOMATION_TOKEN" \
              https://api.github.com/repos/ddskhosana/visual-math-lab-automation/dispatches \
              -d '{"event_type": "visual-updated", "client_payload": { "ref": "${{ github.sha }}" }}'
            echo "Successfully dispatched visual-updated event to visual-math-lab-automation."
          else
            echo "No changes in data/visuals.json; skipping automation notification."
          fi
